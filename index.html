<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chia nội dung</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <header>
            <h2>Chia Tráng</h2>
            <p>Mỗi dòng theo định dạng:</p>
            <p><b>[id] [text] [text] [2fa secret]</b></p>
        </header>

        <div class="input-section">

            <textarea
                id="input"
                placeholder="Ví dụ:
123456 user@gmail.com matkhau123 JBSWY3DPEHPK3PXP
654321 abc@gmail.com 123456 QWERTYUIOPASDFGH">
            </textarea>

            <div class="actions">

                <button id="save">

                    <svg width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>

                        <polyline points="17 21 17 13 7 13 7 21"></polyline>

                        <polyline points="7 3 7 8 15 8"></polyline>

                    </svg>

                    Lưu nội dung

                </button>

                <div id="status"></div>

            </div>

        </div>

        <div id="result"></div>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
