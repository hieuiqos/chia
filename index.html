<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình xử lý 2FA & Data</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Nạp thư viện OTPAuth để tạo mã 2FA 6 số -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>

    <!-- ========================================== -->
    <!-- GIỮ NGUYÊN CÁC SCRIPT FIREBASE TỪ chia-noi-dung.zip Ở ĐÂY -->
    <!-- Ví dụ: 
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    -->
    <!-- ========================================== -->
</head>
<body>
    <div class="container">
        <h2>Công cụ phân giải dữ liệu & 2FA</h2>
        <p>Paste nội dung vào đây (Phân cách bằng dấu <b>|</b>, <b>Tab</b> hoặc <b>Khoảng trắng</b>):</p>
        <textarea id="inputData" rows="6" placeholder="Ví dụ:&#10;ID123 | text_1 | text_2 | JBSWY3DPEHPK3PXP"></textarea>
        <button id="processBtn" onclick="processData()">Hiển thị kết quả</button>
        
        <div class="header-labels">
            <span>[ ID ]</span>
            <span>[ Text 1 ]</span>
            <span>[ Text 2 ]</span>
            <span>[ Code 2FA ]</span>
        </div>
        
        <div id="output"></div>
    </div>

    <!-- Script xử lý chính -->
    <script src="script.js"></script>
</body>
</html>
