<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Xử Lý 2FA</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện xử lý mã 2FA tự động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
</head>
<body>
    <h2>Nhập dữ liệu của bạn</h2>
    <p>Định dạng: <strong>[id] [text] [text] [code 2fa]</strong></p>
    <textarea id="dataInput" rows="8" placeholder="Dán các dòng dữ liệu vào đây..."></textarea>
    <button id="processBtn" class="primary-btn">Hiển thị Giao diện</button>
    
    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
