<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Splitter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Word Splitter</h1>

        <p>Dán nội dung vào ô bên dưới. Dữ liệu sẽ tự động lưu.</p>

    </div>


    <div class="editor">

        <textarea
            id="input"
            placeholder="Dán nội dung tại đây..."
            spellcheck="false"
        ></textarea>

    </div>


    <div class="status">

        <span id="saveStatus">
            Đã đồng bộ
        </span>

    </div>


    <div id="result">

    </div>

</div>


<div id="toast">

</div>


</body>

<script type="module" src="script.js"></script>

</html>
